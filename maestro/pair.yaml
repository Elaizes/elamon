# Pairs with the test service by address and code, as a person would.
appId: io.github.elaizes.elamon.debug
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Watch a computer"
    timeout: 15000
- waitForAnimationToEnd
- tapOn: "Add computer"
- tapOn: "Address"
- inputText: ${ADDRESS}
- hideKeyboard
- scrollUntilVisible:
    element: "Next"
    timeout: 10000
- tapOn: "Next"
- extendedWaitUntil:
    visible: "These digits match"
    timeout: 20000
- takeScreenshot: 01-pair-code
# The code opens once the certificate's digits are said to match. A tap in the first second the
# screen is ready is ignored (one meant for something else may land there), so it is tapped again.
- repeat:
    times: 10
    while:
      visible: "These digits match"
    commands:
      - tapOn: "These digits match"
      - waitForAnimationToEnd
- tapOn: "Code from the computer"
- inputText: ${CODE}
- hideKeyboard
- tapOn:
    text: "Pair"
    below: "Code from the computer"
- extendedWaitUntil:
    visible: "Overview"
    timeout: 20000
- takeScreenshot: 02-overview
