# Every tab and a detail page, with the computer paired by pair.yaml.
appId: io.github.elaizes.elamon.debug
---
- launchApp
- extendedWaitUntil:
    visible: ${NAME}
    timeout: 20000
- tapOn: ${NAME}
- extendedWaitUntil:
    visible: "Overview"
    timeout: 20000
- waitForAnimationToEnd
- takeScreenshot: 03-overview
- scroll
- takeScreenshot: 04-overview-scrolled
- tapOn: "Processes"
- waitForAnimationToEnd
- takeScreenshot: 05-processes
- tapOn: "Sensors"
- waitForAnimationToEnd
- takeScreenshot: 06-sensors
- tapOn: "Control"
- waitForAnimationToEnd
- takeScreenshot: 07-control
- scrollUntilVisible:
    element: "Say hello"
    timeout: 30000
- takeScreenshot: 08-control-actions
- tapOn: "Say hello"
# The default profile asks to unlock the phone for actions, which a flow can't; an emulator without
# a screen lock confirms instead.
- runFlow:
    when:
      visible: "Say hello\\?"
    commands:
      - takeScreenshot: 08b-action-no-screen-lock
      - tapOn:
          text: "Say hello"
          rightOf: "Cancel"
- extendedWaitUntil:
    visible: ".*hello from the test service.*"
    timeout: 15000
- takeScreenshot: 09-action-output
- back
- tapOn: "Overview"
- waitForAnimationToEnd
# scrollUntilVisible gives up on a screen that changes every second; swipe instead.
- swipe:
    direction: DOWN
- swipe:
    direction: DOWN
- tapOn: "CPU"
- waitForAnimationToEnd
- takeScreenshot: 10-cpu-detail
- swipe:
    start: 50%, 30%
    end: 80%, 30%
    duration: 2000
- takeScreenshot: 11-cpu-chart-touch
# The settings' own dashboard: a choice for an action with a parameter.
- back
- tapOn: "Test"
- extendedWaitUntil:
    visible: "Test load"
    timeout: 10000
- takeScreenshot: 12-own-dashboard
- tapOn: "Mode"
- waitForAnimationToEnd
- takeScreenshot: 13-own-choice
- tapOn: "Fast"
# The action asks first ("Mode: Fast?"; it would unlock the phone, which an emulator without a
# screen lock can't): its button, named as the action, is right of Cancel.
- extendedWaitUntil:
    visible: "Mode: Fast\\?"
    timeout: 10000
- takeScreenshot: 13b-own-choice-confirm
- tapOn:
    text: "Mode"
    rightOf: "Cancel"
- extendedWaitUntil:
    visible: ".*mode fast.*"
    timeout: 15000
- takeScreenshot: 14-own-choice-output
