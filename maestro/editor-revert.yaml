# Back to the files, after editor.yaml saved the Test tab and run.sh found it in the editor's file:
# the dashboard is again as the settings files have it, the gauge gone from the editor and from the
# tab. Still with the role owner, on the Test tab.
appId: io.github.elaizes.elamon.debug
---
- tapOn: "More"
- tapOn: "Edit dashboard"
- scrollUntilVisible:
    element: "Gauge · CPU"
    timeout: 20000
- tapOn: "More"
- tapOn: "Back to the files"
- extendedWaitUntil:
    visible: "Back to the files\\?"
    timeout: 10000
- takeScreenshot: 86-editor-revert
- tapOn: "Back to the files"
# It writes the settings too: asked first, as Save is.
- extendedWaitUntil:
    visible: "Write this to the computer.s settings\\?"
    timeout: 10000
- tapOn: "Back to the files"
- extendedWaitUntil:
    visible: "Back as the settings files have it"
    timeout: 20000
- extendedWaitUntil:
    notVisible: "Gauge · CPU"
    timeout: 20000
- takeScreenshot: 87-editor-reverted
- back
- extendedWaitUntil:
    visible: "Test load"
    timeout: 10000
- extendedWaitUntil:
    notVisible: "CPU"
    timeout: 30000
