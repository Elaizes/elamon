# The phone made a glance one by run.sh (elamond clients role all glance) while the app was closed:
# the basics only. No Processes tab, and no Control tab either, as nothing on it is the basics; the
# settings' own Test tab stays for its reading, without the choice a glance phone can't make.
appId: io.github.elaizes.elamon.debug
---
- launchApp
- extendedWaitUntil:
    visible: ${NAME}
    timeout: 20000
- tapOn: ${NAME}
- extendedWaitUntil:
    visible: "This phone's role: Glance.*"
    timeout: 20000
- assertNotVisible: "Processes"
- assertNotVisible: "Control"
- tapOn: "Overview"
- waitForAnimationToEnd
- takeScreenshot: 15-glance-overview
- tapOn: "Test"
- extendedWaitUntil:
    visible: "Test load"
    timeout: 10000
- assertNotVisible: "Mode"
- takeScreenshot: 16-glance-test
