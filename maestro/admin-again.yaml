# Right after glance.yaml, with the computer's screen still open, run.sh made the phone an admin
# again. Not reopened, the app hears it on its stream (a ui line) and shows the tabs at once.
appId: io.github.elaizes.elamon.debug
---
- extendedWaitUntil:
    visible: "Processes"
    timeout: 30000
- extendedWaitUntil:
    visible: "Control"
    timeout: 10000
- takeScreenshot: 17-admin-again
- tapOn: "Processes"
- extendedWaitUntil:
    visible: "This phone's role: Admin.*"
    timeout: 10000
- extendedWaitUntil:
    visible: "[0-9]+ in all"
    timeout: 10000
- takeScreenshot: 18-processes-again
