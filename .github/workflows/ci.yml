# The service's lints and tests (with the protocol fixtures), the app's unit tests, lint and
# release build, and the NixOS module in a VM.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elamond
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: elamond
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: app-reports
          path: app/build/reports

  nixos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: KVM for the VM test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: system-features = nixos-test benchmark big-parallel kvm
      - run: nix flake check -L
