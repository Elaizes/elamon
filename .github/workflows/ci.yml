# elamond's lints and tests (with the protocol fixtures), and its tests built on each distribution
# the guide names, with that distribution's compiler, with install.sh there; install.sh,
# `elamond setup` and `elamond update` with a real systemd user manager; install.sh's lint; the
# app's unit tests, lint and release build; and the NixOS module in a VM.
#
# Every action is pinned to a commit, its release in the comment beside it: a tag can be moved,
# a commit can't. To update one: git ls-remote https://github.com/OWNER/REPO refs/tags/TAG
# (the ^{} line for an annotated tag).
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Reading the code is all any job needs.
permissions:
  contents: read

jobs:
  elamond:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elamond
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: elamond
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked

  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: shellcheck --version && shellcheck install.sh .github/local-release.sh

  # elamond built and tested on each distribution the guide names, as someone building it there
  # from source would: Fedora, Arch and openSUSE with their own Rust, Debian and Ubuntu with
  # rustup's, theirs being older than 1.88. A C compiler is all the crates need besides; Python
  # serves the release install.sh is tried on, made there from what was built.
  distros:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: debian:stable
            tools: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl gcc libc6-dev git python3
            rustup: true
          - image: ubuntu:24.04
            tools: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl gcc libc6-dev git python3
            rustup: true
          - image: fedora:latest
            tools: dnf install -y cargo gcc git python3
          - image: archlinux:latest
            tools: pacman -Syu --noconfirm --needed rust gcc git python
          - image: opensuse/tumbleweed
            tools: zypper --non-interactive install cargo gcc git tar gzip gawk python3
    container: ${{ matrix.image }}
    steps:
      - name: Build tools
        run: ${{ matrix.tools }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - if: matrix.rustup
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: cargo --version && cargo test --locked
        working-directory: elamond
      # As a user: install.sh refuses root, which the job runs as.
      - name: install.sh from a release made here, served on 127.0.0.1
        run: |
          cargo build --locked --manifest-path elamond/Cargo.toml
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' elamond/Cargo.toml | head -n 1)
          sh .github/local-release.sh elamond/target/debug/elamond "$version" /tmp/release 8765
          python3 -m http.server -b 127.0.0.1 -d /tmp/release 8765 > /tmp/http.log 2>&1 &
          for _ in $(seq 50); do curl -sf -o /dev/null http://127.0.0.1:8765/releases.json && break; sleep 0.2; done
          mkdir -p /tmp/home && chown 65534:65534 /tmp/home && cp install.sh /tmp/install.sh
          python3 -c 'import os, sys; os.setgroups([]); os.setgid(65534); os.setuid(65534); os.execvp(sys.argv[1], sys.argv[1:])' \
            env HOME=/tmp/home ELAMON_RELEASES_URL=http://127.0.0.1:8765/releases.json sh /tmp/install.sh --no-setup
          /tmp/home/.local/bin/elamond --version | grep -qx "elamond $version"

  # install.sh and `elamond setup` as a person runs them, under a real systemd user manager, from a
  # release made here and served on 127.0.0.1: the service installed, started and answering,
  # `setup --check` content, a second run changing nothing; then `elamond update` finding a newer
  # release there, installing it and starting the service again on it.
  setup:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: elamond
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: elamond
      - run: cargo build --locked
      - name: A user manager for the runner's user
        run: |
          sudo loginctl enable-linger "$USER"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          for _ in $(seq 60); do
            XDG_RUNTIME_DIR=/run/user/$(id -u) systemctl --user show --property=Version > /dev/null 2>&1 && exit 0
            sleep 1
          done
          echo "no user manager" >&2
          exit 1
      - name: A release made here, served on 127.0.0.1 as GitHub would
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          sh ../.github/local-release.sh target/debug/elamond "$version" "$RUNNER_TEMP/release" 8765
          nohup python3 -m http.server -b 127.0.0.1 -d "$RUNNER_TEMP/release" 8765 > "$RUNNER_TEMP/http.log" 2>&1 &
          echo "ELAMON_RELEASES_URL=http://127.0.0.1:8765/releases.json" >> "$GITHUB_ENV"
          for _ in $(seq 50); do curl -sf -o /dev/null http://127.0.0.1:8765/releases.json && exit 0; sleep 0.2; done
          exit 1
      - name: install.sh, which runs elamond setup
        run: |
          sh ../install.sh | tee "$RUNNER_TEMP/setup.txt"
          ~/.local/bin/elamond --version
          grep -q 'OK  the service answers on port 47823' "$RUNNER_TEMP/setup.txt"
          test -f ~/.config/elamon/elamond.toml
          grep -q '^ExecStart=/home/.*/\.local/bin/elamond serve$' ~/.config/systemd/user/elamond.service
      - name: The service answers
        run: |
          curl -sSk --retry 10 --retry-connrefused https://127.0.0.1:47823/api/v1/hello | tee "$RUNNER_TEMP/hello.json"
          grep -q '"app":"elamon"' "$RUNNER_TEMP/hello.json"
      - run: ~/.local/bin/elamond setup --check
      - name: Run again, it changes nothing
        run: ~/.local/bin/elamond setup | tee /dev/stderr | grep -q 'elamond.service is up to date'
      # 9.9.9: the binary built here, behind a script that says it is 9.9.9.
      - name: elamond update --check names a newer release
        run: |
          cp target/debug/elamond "$RUNNER_TEMP/elamond-real"
          mkdir -p "$RUNNER_TEMP/fake"
          cat > "$RUNNER_TEMP/fake/elamond" << EOF
          #!/bin/sh
          [ "\$1" = --version ] && { echo "elamond 9.9.9"; exit 0; }
          exec "$RUNNER_TEMP/elamond-real" "\$@"
          EOF
          sh ../.github/local-release.sh "$RUNNER_TEMP/fake/elamond" 9.9.9 "$RUNNER_TEMP/release" 8765
          ~/.local/bin/elamond update --check | tee "$RUNNER_TEMP/check.txt"
          grep -q '^elamond 9.9.9 is out; this is ' "$RUNNER_TEMP/check.txt"
          grep -q 'elamond update installs it' "$RUNNER_TEMP/check.txt"
      - name: elamond update installs it and starts the service again on it
        run: |
          before=$(systemctl --user show --property=MainPID --value elamond)
          ~/.local/bin/elamond update --yes | tee "$RUNNER_TEMP/update.txt"
          grep -q 'OK  started the service again on it' "$RUNNER_TEMP/update.txt"
          ~/.local/bin/elamond --version | grep -qx 'elamond 9.9.9'
          after=$(systemctl --user show --property=MainPID --value elamond)
          test "$after" != 0 && test "$after" != "$before"
          curl -sSk --retry 10 --retry-connrefused https://127.0.0.1:47823/api/v1/hello | grep -q '"app":"elamon"'
      - if: failure()
        run: journalctl --user -u elamond --no-pager || systemctl --user status elamond --no-pager

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - name: Android SDK 37
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleRelease
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-reports
          path: app/build/reports

  nixos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: KVM for the VM test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: cachix/install-nix-action@91f6a0f59e94dfb2cfed0f4000f36a68ead1d20c # v31.11.4
        with:
          extra_nix_config: system-features = nixos-test benchmark big-parallel kvm
      - run: nix flake check -L
