# The standard dashboards elamond starts with, and the templates they use: yours to change. A
# profile's `dashboards` (in elamond.toml) names those it shows as tabs; `elamond defaults
# dashboards.sensors` prints one as elamond has it. This file is read after elamond.toml, and
# before drop-ins whose names come after its own (phones.toml among them).

# ---- Header: chips under the computer's name, on every tab ---------------------------------

[dashboards.header]
title = "Header"
icon = "overview"

[[dashboards.header.widgets]]
id = "os"
type = "status"
value = "system.os"

[[dashboards.header.widgets]]
id = "uptime"
type = "text"
text = "Up {system.uptime:duration}"

[[dashboards.header.widgets]]
id = "power"
type = "status"
value = "power.on_ac"
when = "power.on_ac"
map = { "true" = "On AC power", "false" = "On battery" }
levels = { "false" = "warning" }

[[dashboards.header.widgets]]
id = "profile"
type = "status"
value = "power.profile"
when = "power.profile"
map = { "power-saver" = "Power saver", balanced = "Balanced", performance = "Performance" }

# ---- Overview ------------------------------------------------------------------------------

[dashboards.overview]
title = "Overview"
icon = "overview"

[[dashboards.overview.widgets]]
id = "cpu"
type = "gauge"
value = "cpu.usage"
label = "CPU"
icon = "chip"
color = "cpu"
caption = "{cpu.temp:temp} · {cpu.freq_max:mhz}"
open = "cpu"

[[dashboards.overview.widgets]]
id = "memory"
type = "gauge"
value = "mem.percent"
label = "Memory"
icon = "memory"
color = "memory"
caption = "{mem.used:bytes} of {mem.total:bytes}"
open = "memory"

[[dashboards.overview.widgets]]
id = "gpus"
type = "value"
for_each = "gpus"
value = "gpu.{item}.usage"
label = "{item.short_name}"
icon = "gpu"
color = "gpu"
spark = true
empty = "{gpu.{item}.summary}"
caption = "{gpu.{item}.temp:temp} · {gpu.{item}.power:watts}"
open = "gpu.{item}"

[[dashboards.overview.widgets]]
id = "temperature"
type = "value"
value = "cpu.temp"
label = "Temperature"
icon = "thermometer"
color = "hot"
spark = true
caption = "{fans.summary}"
open = "sensors"

[[dashboards.overview.widgets]]
id = "network"
type = "graph"
values = ["net.rx", "net.tx"]
labels = ["Download", "Upload"]
colors = ["rx", "tx"]
label = "Network"
icon = "network"
color = "rx"
height = "small"
floor = 65536
caption = "{net.up_names}"
open = "network"

[[dashboards.overview.widgets]]
id = "storage"
type = "table"
source = "disks"
label = "Storage"
icon = "storage"
color = "read"
limit = 3
columns = [
  { field = "mount", grow = true },
  { field = "available", format = "bytes", label = "free" },
  { field = "percent", bar = { max = 100 } },
]
caption = "Read {disk.read:rate} · write {disk.write:rate}"
open = "storage"

[[dashboards.overview.widgets]]
id = "battery"
type = "meter"
value = "battery.percent"
when = "battery.percent"
label = "Battery"
icon = "battery"
color = "battery"
span = 4
caption = "{battery.status_text} · {battery.power:watts} · {battery.time_text} · health {battery.health:percent}"
open = "battery"

# ---- UPS: one dashboard for each [sources.<id>], a UPS or a power station -------------------
# `{item}` is the source's id. What a station doesn't have is left out (a widget's `when`, a list's
# rows), and stays once it has had it, so the dashboard keeps its shape while upsd isn't read.

[dashboards.ups]
title = "{item.name}"
icon = "battery"
for_each = "ups"

[[dashboards.ups.widgets]]
id = "status"
type = "status"
value = "{item}.status"
label = "Status"
icon = "power"
caption = "{{item}.status.since:duration} · {{item}.status.flags}"

[[dashboards.ups.widgets]]
id = "charge"
type = "gauge"
value = "{item}.battery.charge"
when = "{item}.battery.charge"
label = "Battery"
icon = "battery"
color = "battery"
caption = "{{item}.battery.runtime:duration}"

[[dashboards.ups.widgets]]
id = "power"
type = "timeline"
source = "{item}"
label = "Power"
icon = "power"

[[dashboards.ups.widgets]]
id = "now"
type = "group"
label = "Power now"
icon = "bolt"
widgets = [
  { id = "grid", type = "value", value = "{item}.input.realpower", when = "{item}.input.realpower", label = "Grid in", icon = "bolt", color = "rx", span = 1 },
  { id = "output", type = "value", value = "{item}.ups.realpower", when = "{item}.ups.realpower", label = "Output", icon = "bolt", color = "tx", span = 1 },
  { id = "ac", type = "value", value = "{item}.output.realpower", when = "{item}.output.realpower", label = "AC out", icon = "power", span = 1 },
  { id = "solar1", type = "value", value = "{item}.experimental.input.dc.1.realpower", when = "{item}.experimental.input.dc.1.realpower", label = "Solar 1", icon = "leaf", color = "good", span = 1 },
  { id = "solar2", type = "value", value = "{item}.experimental.input.dc.2.realpower", when = "{item}.experimental.input.dc.2.realpower", label = "Solar 2", icon = "leaf", color = "good", span = 1 },
  { id = "load", type = "value", value = "{item}.ups.load", when = "{item}.ups.load", label = "Load", icon = "gauge", span = 1 },
]

[[dashboards.ups.widgets]]
id = "battery"
type = "list"
label = "Battery"
icon = "battery"
items = [
  { label = "Charge", value = "{item}.battery.charge" },
  { label = "Runtime", value = "{item}.battery.runtime" },
  { label = "To empty", value = "{item}.estimate.to_empty" },
  { label = "To full", value = "{item}.estimate.to_full" },
  { label = "Charge limit", value = "{item}.experimental.battery.charge.max" },
  { label = "Discharge limit", value = "{item}.experimental.battery.charge.minimum" },
  { label = "Health", value = "{item}.experimental.battery.health", format = "percent", unit = "%" },
  { label = "Capacity", value = "{item}.battery.capacity" },
  { label = "Voltage", value = "{item}.battery.voltage" },
  { label = "Current", value = "{item}.battery.current" },
]

[[dashboards.ups.widgets]]
id = "outlets"
type = "table"
source = "outlets"
filter = { source = "{item}" }
label = "Outlets"
icon = "power"
hide_empty = true
columns = [
  { field = "desc", grow = true },
  { field = "status", label = "State", map = { on = "On", off = "Off" } },
  { field = "realpower", label = "Power" },
]

[[dashboards.ups.widgets]]
id = "electrical"
type = "list"
label = "Electrical"
icon = "bolt"
items = [
  { label = "Input voltage", value = "{item}.input.voltage" },
  { label = "Output voltage", value = "{item}.output.voltage" },
  { label = "Input frequency", value = "{item}.input.frequency" },
  { label = "Output frequency", value = "{item}.output.frequency" },
  { label = "Battery temperature", value = "{item}.battery.temperature" },
  { label = "Inverter", value = "{item}.ups.temperature" },
  { label = "DC stage", value = "{item}.experimental.ups.temperature.dc" },
]

[[dashboards.ups.widgets]]
id = "charge_graph"
type = "graph"
values = ["{item}.battery.charge"]
when = "{item}.battery.charge"
labels = ["Charge"]
colors = ["battery"]
label = "Charge"
icon = "battery"
color = "battery"
min = 0
max = 100

[[dashboards.ups.widgets]]
id = "watts"
type = "graph"
values = ["{item}.input.realpower", "{item}.ups.realpower"]
when = "{item}.ups.realpower"
labels = ["Grid in", "Output"]
colors = ["rx", "tx"]
label = "Power"
icon = "bolt"
color = "tx"
min = 0

[[dashboards.ups.widgets]]
id = "solar"
type = "graph"
values = ["{item}.experimental.input.dc.1.realpower", "{item}.experimental.input.dc.2.realpower"]
when = "{item}.experimental.input.dc.1.realpower"
labels = ["Solar 1", "Solar 2"]
colors = ["good", "primary"]
label = "Solar"
icon = "leaf"
color = "good"
min = 0

[[dashboards.ups.widgets]]
id = "details"
type = "list"
label = "Details"
icon = "chip"
items = [
  { label = "Model", value = "{item}.device.model" },
  { label = "Firmware", value = "{item}.ups.firmware" },
  { label = "Rated power", value = "{item}.ups.realpower.nominal" },
  { label = "Low battery at", value = "{item}.battery.charge.low" },
  { label = "Low runtime at", value = "{item}.battery.runtime.low" },
]

# Run as the source's `commands` and `settings` allow: a widget whose action the station doesn't
# offer is left out, and a group left with none is too. With two sources, each one's switches list
# the outlets of both.
[[dashboards.ups.widgets]]
id = "switches"
type = "group"
label = "Outlets"
icon = "power"
collapsed = true
for_each = "outlets"
widgets = [
  { id = "outlet", type = "toggle", label = "{item.desc}", value = "{item.source}.outlet.{item.id}.status", action = "nut.command.{item.source}", param = "cmd", on = "outlet.{item.id}.load.on", off = "outlet.{item.id}.load.off", map = { on = "outlet.{item.id}.load.on", off = "outlet.{item.id}.load.off" } },
]

[[dashboards.ups.widgets]]
id = "station"
type = "group"
label = "Station"
icon = "control"
collapsed = true
widgets = [
  { id = "charge_max", type = "slider", label = "Charge limit", value = "{item}.experimental.battery.charge.max", action = "nut.set.{item}.experimental.battery.charge.max", param = "value" },
  { id = "charge_min", type = "slider", label = "Discharge limit", value = "{item}.experimental.battery.charge.minimum", action = "nut.set.{item}.experimental.battery.charge.minimum", param = "value" },
  { id = "charging", type = "slider", label = "AC charging power", value = "{item}.experimental.charger.realpower.max", action = "nut.set.{item}.experimental.charger.realpower.max", param = "value" },
  { id = "brightness", type = "slider", label = "Screen brightness", value = "{item}.experimental.display.brightness", action = "nut.set.{item}.experimental.display.brightness", param = "value" },
  { id = "xboost", type = "select", label = "X-Boost", value = "{item}.experimental.output.xboost", action = "nut.set.{item}.experimental.output.xboost", param = "value" },
  { id = "ac_timeout", type = "select", label = "AC timeout", value = "{item}.experimental.output.ac.timeout", action = "nut.set.{item}.experimental.output.ac.timeout", param = "value" },
  { id = "screen_timeout", type = "select", label = "Screen timeout", value = "{item}.experimental.display.timeout", action = "nut.set.{item}.experimental.display.timeout", param = "value" },
  { id = "beeper", type = "toggle", label = "Beeper", value = "{item}.ups.beeper.status", action = "nut.command.{item}", param = "cmd", on = "beeper.enable", off = "beeper.disable", map = { enabled = "beeper.enable", disabled = "beeper.disable" } },
]

# ---- Processes -----------------------------------------------------------------------------

[dashboards.processes]
title = "Processes"
icon = "processes"
role = "monitor"

[[dashboards.processes.widgets]]
id = "table"
type = "table"
source = "processes"
search = ["name", "cmd", "user", "pid"]
limit = 500
sort = { field = "cpu", desc = true }
sorts = ["cpu", "mem", "gpu", "io"]
sort_labels = { cpu = "CPU", mem = "Memory", gpu = "GPU", io = "Disk" }
columns = [
  { field = "name", grow = true },
  { field = "cpu", label = "CPU", format = "percent", bar = { max = 25 } },
  { field = "mem", label = "Memory", format = "bytes" },
]
expand = [
  { field = "cmd", label = "Command" },
  { field = "user", label = "User" },
  { field = "pid", label = "PID", format = "integer" },
  { field = "ppid", label = "Parent", format = "integer" },
  { field = "status", label = "State" },
  { field = "start", label = "Started", format = "time" },
  { field = "read", label = "Disk read", format = "rate" },
  { field = "write", label = "Disk write", format = "rate" },
  { field = "gpu", label = "GPU", format = "percent" },
  { field = "gpu_mem", label = "GPU memory", format = "bytes" },
]
row_actions = [
  { action = "process.signal", label = "Quit", params = { pid = "{pid}", start = "{start}", signal = "term" } },
  { action = "process.signal", label = "Force kill", params = { pid = "{pid}", start = "{start}", signal = "kill" } },
]

# ---- Sensors -------------------------------------------------------------------------------

[dashboards.sensors]
title = "Sensors"
icon = "thermometer"

[templates.sensor_table]
type = "table"
source = "temps"
hide_empty = true
sort = { field = "label", desc = false }
columns = [
  { field = "label", grow = true },
  { field = "value", format = "temp", bar = { max = "crit" } },
]
expand = [
  { field = "chip", label = "Chip" },
  { field = "high", label = "High", format = "temp" },
  { field = "crit", label = "Critical", format = "temp" },
]

[[dashboards.sensors.widgets]]
id = "cpu"
use = "sensor_table"
label = "Processor"
icon = "chip"
color = "cpu"
filter = { kind = "cpu" }

[[dashboards.sensors.widgets]]
id = "gpu"
use = "sensor_table"
label = "Graphics"
icon = "gpu"
color = "gpu"
filter = { kind = "gpu" }

[[dashboards.sensors.widgets]]
id = "storage"
use = "sensor_table"
label = "Storage"
icon = "storage"
color = "read"
filter = { kind = "storage" }

[[dashboards.sensors.widgets]]
id = "wireless"
use = "sensor_table"
label = "Wireless"
icon = "network"
color = "rx"
filter = { kind = "wireless" }

[[dashboards.sensors.widgets]]
id = "battery"
use = "sensor_table"
label = "Battery"
icon = "battery"
color = "battery"
filter = { kind = "battery" }

[[dashboards.sensors.widgets]]
id = "board"
use = "sensor_table"
label = "Board"
icon = "thermometer"
color = "hot"
filter = { kind = "board" }

[[dashboards.sensors.widgets]]
id = "other"
use = "sensor_table"
label = "Other"
icon = "thermometer"
color = "hot"
filter = { kind = "other" }

[[dashboards.sensors.widgets]]
id = "fans"
type = "table"
source = "fans"
label = "Fans"
icon = "fan"
hide_empty = true
columns = [
  { field = "label", grow = true },
  { field = "rpm", format = "rpm", bar = { max = "top" } },
]

# ---- Control -------------------------------------------------------------------------------

[dashboards.control]
title = "Control"
icon = "control"

[[dashboards.control.widgets]]
id = "links"
type = "table"
source = "links"
label = "Links"
icon = "globe"
hide_empty = true
row_open = "url"
columns = [
  { field = "name", grow = true },
  { field = "unit_state", label = "Unit" },
  { field = "up", format = "bool", map = { "true" = "Up", "false" = "Down" } },
]
expand = [
  { field = "url", label = "Address" },
  { field = "unit", label = "Unit" },
  { field = "port", label = "Port", format = "integer" },
]
row_actions = [
  { action = "unit.start", label = "Start", params = { link = "{id}" } },
  { action = "unit.stop", label = "Stop", params = { link = "{id}" } },
  { action = "unit.restart", label = "Restart", params = { link = "{id}" } },
  { open = "unit_log", label = "Journal" },
]

[[dashboards.control.widgets]]
id = "media"
type = "media"
label = "Media"
icon = "music"

[[dashboards.control.widgets]]
id = "profile"
type = "select"
value = "power.profile"
action = "profile.set"
param = "profile"
label = "Power profile"
icon = "bolt"
color = "battery"
span = 4

[[dashboards.control.widgets]]
id = "actions"
type = "group"
label = "Actions"
icon = "terminal"
color = "tertiary"
for_each = "actions"
widgets = [{ type = "button", action = "{item}", label = "{item.name}", icon = "{item.icon}" }]

[[dashboards.control.widgets]]
id = "power"
type = "group"
label = "Power"
icon = "power"
color = "hot"
widgets = [
  { type = "button", action = "power.lock", label = "Lock", icon = "lock", span = 1 },
  { type = "button", action = "power.suspend", label = "Sleep", icon = "moon", span = 1 },
  { type = "button", action = "power.reboot", label = "Restart", icon = "restart", span = 1 },
  { type = "button", action = "power.poweroff", label = "Shut down", icon = "power", span = 1 },
]

[[dashboards.control.widgets]]
id = "displays"
type = "table"
source = "displays"
filter = { connected = true }
label = "Displays"
icon = "monitor"
hide_empty = true
collapsed = true
caption = "{displays.summary}"
columns = [
  { field = "name", grow = true },
  { field = "state" },
  { field = "mode" },
]
expand = [
  { field = "connector", label = "Port" },
  { field = "gpu", label = "GPU" },
  { field = "size", label = "Size" },
  { field = "preferred", label = "Best mode" },
  { field = "max_refresh", label = "Fastest", format = "{:.0}", unit = "Hz" },
  { field = "position", label = "Position" },
  { field = "year", label = "Made", format = "integer" },
]

# Each monitor turned on or off, its picture (DPMS) and its brightness, where the service acts on them
# (Hyprland, `[displays]`): a widget whose action isn't offered is left out, and the group with none.
# Turning off the last monitor that shows a picture asks for its name.
[[dashboards.control.widgets]]
id = "display_controls"
type = "group"
label = "Monitors"
icon = "monitor"
collapsed = true
for_each = "displays"
widgets = [
  { id = "output", type = "toggle", label = "{item.connector}", caption = "{item.name}", value = "display.{item}.output", action = "display.output.{item.connector}", param = "state", on = "on", off = "off", span = 2 },
  { id = "dpms", type = "toggle", label = "{item.connector} DPMS", value = "display.{item}.dpms", action = "display.dpms.{item.connector}", param = "state", on = "on", off = "off", span = 2 },
  { id = "brightness", type = "slider", label = "{item.connector} brightness", value = "display.{item}.brightness", action = "display.brightness.{item.connector}", param = "level", span = 4 },
]

[[dashboards.control.widgets]]
id = "journal"
type = "button"
label = "Journal"
icon = "terminal"
open = "journal"
span = 4
role = "monitor"

[[dashboards.control.widgets]]
id = "events"
type = "button"
label = "Events"
icon = "terminal"
open = "events"
span = 4
role = "monitor"

[[dashboards.control.widgets]]
id = "activity"
type = "button"
label = "Activity log"
icon = "clock"
open = "activity"
span = 4
role = "monitor"

