values = ["net.rx", "net.tx"]
labels = ["Download", "Upload"]
colors = ["rx", "tx"]
label = "Traffic"
icon = "network"
color = "rx"
floor = 65536

[[dashboards.network.widgets]]
id = "interfaces"
type = "table"
source = "net"
label = "Interfaces"
icon = "network"
filter = { up = true }
columns = [
  { field = "name", grow = true },
  { field = "kind" },
  { field = "rx", label = "↓", format = "rate" },
