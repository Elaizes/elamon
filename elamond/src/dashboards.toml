[[dashboards.storage.widgets]]
id = "throughput"
type = "graph"
values = ["disk.read", "disk.write"]
labels = ["Read", "Write"]
colors = ["read", "write"]
label = "Throughput"
icon = "storage"
color = "read"
floor = 1048576

[[dashboards.storage.widgets]]
id = "devices"
type = "table"
source = "disk_io"
label = "Devices"
icon = "storage"
hide_empty = true
columns = [
  { field = "name", grow = true },
  { field = "read", label = "↓", format = "rate" },
  { field = "write", label = "↑", format = "rate" },
]

[[dashboards.storage.widgets]]
id = "disks"
type = "table"
source = "disks"
label = "File systems"
icon = "storage"
columns = [
  { field = "mount", grow = true },
  { field = "available", label = "free", format = "bytes" },
  { field = "percent", bar = { max = 100 } },
]
expand = [
  { field = "used", label = "Used", format = "bytes" },
  { field = "total", label = "Size", format = "bytes" },
  { field = "fs", label = "File system" },
  { field = "device", label = "Device" },
]

[[dashboards.storage.widgets]]
id = "top"
use = "top_processes"
sort = { field = "io", desc = true }
columns = [
  { field = "name", grow = true },
  { field = "read", format = "rate" },
  { field = "write", format = "rate" },
]

[dashboards.battery]
title = "Battery"
icon = "battery"

[[dashboards.battery.widgets]]
id = "power"
type = "graph"
values = ["battery.power"]
labels = ["Power"]
colors = ["battery"]
label = "Power draw"
icon = "bolt"
color = "battery"
floor = 5

[[dashboards.battery.widgets]]
id = "details"
type = "list"
label = "Details"
icon = "battery"
items = [
  { label = "Charge", value = "battery.percent" },
  { label = "State", value = "battery.status_text" },
  { label = "Power", value = "battery.power" },
  { label = "Time", value = "battery.time_text" },
  { label = "Energy now", value = "battery.energy_now" },
  { label = "Full charge", value = "battery.energy_full" },
  { label = "Design capacity", value = "battery.energy_design" },
  { label = "Health", value = "battery.health" },
  { label = "Charge cycles", value = "battery.cycles" },
  { label = "Model", value = "battery.model" },
]

[dashboards.activity]
title = "Activity log"
icon = "clock"
role = "monitor"

[[dashboards.activity.widgets]]
id = "log"
type = "table"
source = "activity"
search = true
limit = 500
sort = { field = "t", desc = true }
columns = [
  { field = "what", grow = true },
  { field = "result" },
  { field = "t", format = "time" },
]
expand = [
  { field = "phone", label = "Phone" },
  { field = "message", label = "Message" },
]

# The system journal from warnings up, which Control's Journal button opens.
[dashboards.journal]
title = "Journal"
icon = "terminal"
role = "monitor"

[[dashboards.journal.widgets]]
id = "system"
type = "log"
scope = "system"
level = "warning"
label = "System journal"
span = 4

# What the rules of the settings and `elamond notify` told, which Control's Events button opens.
[dashboards.events]
title = "Events"
icon = "terminal"
role = "monitor"

[[dashboards.events.widgets]]
id = "events"
type = "log"
scope = "events"
level = "info"
label = "Events"
span = 4

# A link's unit's journal, one for each link with a unit, which its row in Control's Links table
# opens.
[dashboards.unit_log]
title = "{item.name}"
icon = "terminal"
role = "monitor"
for_each = "links"

[[dashboards.unit_log.widgets]]
id = "log"
type = "log"
scope = "unit"
unit = "{item.unit}"
label = "Journal"
span = 4
