[package]
name = "elamond"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
description = "Serves this computer's metrics to the Elamon Android app"
license = "GPL-3.0-or-later"

[profile.release]
lto = true
strip = true
codegen-units = 1

[dependencies]
argon2 = { version = "0.6.0", default-features = false, features = ["alloc", "zeroize"] }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio", "query", "json"] }
axum-server = { version = "0.9.0", features = ["tls-rustls-no-provider"] }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc", "zeroize"] }
data-encoding = "2.11.1"
drm = "0.15.0"
futures-util = "0.3.34"
libc = "0.2.191"
mdns-sd = "0.21.7"
nvml-wrapper = "0.13.0"
qrcode = "0.14.1"
rand = "0.10.3"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sysinfo = "0.40.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "signal", "fs", "process", "io-util"] }
toml = "1.2.1"
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
zeroize = "1.9.1"

[dev-dependencies]
# Already among axum's; calls the router in tests as a phone would.
tower = { version = "0.5.3", default-features = false, features = ["util"] }
# Already among rustls's; checks rotation statements in tests as the app does.
webpki = { package = "rustls-webpki", version = "0.103.16", default-features = false, features = ["ring"] }
